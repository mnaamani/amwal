[package]
name = "ledger-http-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "ledger-http-server"
path = "src/main.rs"

[dependencies]
ledger-api = { path = "../ledger-api", features = ["openapi"] }
ledger = { path = "../ledger" }
domain-events = { path = "../domain-events" }

actix-web = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "4", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "7", features = ["actix-web"] }
dotenvy = "0.15"
